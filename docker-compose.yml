services:
  postgres:
    image: postgres:17

    container_name: payflowx-postgres

    environment:
      POSTGRES_DB: payflowxdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: